    <line x1="200" y1="40"  x2="200" y2="360"/>
    <line x1="40"  y1="200" x2="360" y2="200"/>
    <line x1="86"  y1="86"  x2="314" y2="314"/>
    <line x1="314" y1="86"  x2="86"  y2="314"/>
 </g>

  <!-- Top: Proteína (saffron) -->
  <path d="M200,40 A160,160 0 0,1 360,200 L314,200 L314,86 Z" fill="#D97706" opacity="0.85"/>
  <text x="262" y="138" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#2C2420" letter-spacing="1.5">PROTEÍNA</text>

  <!-- Top-right: Arroz (cream) -->
  <path d="M360,200 A160,160 0 0,1 314,314 L314,200 Z" fill="#FBF7EF" opacity="0.95"/>
  <text x="332" y="240" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" fill="#2C2420" letter-spacing="1.5">ARROZ</text>

  <!-- Bottom-right: Feijão (caju/cocoa) -->
  <path d="M314,314 A160,160 0 0,1 86,314 L200,314 L200,360 Z" fill="#5A3A2E" opacity="0.92"/>
  <text x="200" y="332" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" fill="#FBF7EF" letter-spacing="1.5">FEIJÃO</text>

  <!-- Bottom-left: Salada (herb) -->
  <path d="M86,314 A160,160 0 0,1 40,200 L86,200 Z" fill="#3A4A2E" opacity="0.88"/>
  <text x="68" y="240" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" fill="#FBF7EF" letter-spacing="1.5">SALADA</text>

  <!-- Top-left: Farofa (saffron lighter) -->
  <path d="M40,200 A160,160 0 0,1 200,40 L200,86 L86,86 Z" fill="#E8A352" opacity="0.85"/>
  <text x="138" y="138" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" fill="#2C2420" letter-spacing="1.5">FAROFA</text>

  <!-- Center decoration -->
  <circle cx="200" cy="200" r="18" fill="#F2EDE3" stroke="#9B8E6A" stroke-width="1.5"/>
