   </radialGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="60%">
      <stop offset="80%" stop-color="#D4C9AC"/>
      <stop offset="100%" stop-color="#9B8E6A"/>
   </radialGradient>
 </defs>

  <!-- Plate base -->
  <circle cx="200" cy="200" r="180" fill="url(#plate)" stroke="url(#ring)" stroke-width="6"/>

  <!-- Compartment dividers (radial lines) -->
