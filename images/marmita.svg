/**
 * Divina Jô — Marmitaria
 * Signature visual: overhead view of a divided marmita (meal container)
 * with five compartments: proteína, arroz, feijão, salada, farofa.
 */
?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Composição da marmita: cinco compartimentos com proteína, arroz, feijão, salada e farofa">
  <defs>
    <radialGradient id="plate" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FBF7EF"/>
